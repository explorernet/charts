{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "n8n.workerName" . }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "n8n.componentLabels" (dict "context" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "n8n.componentLabels" (dict "context" . "component" "worker") | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- toYaml .Values.worker.extraArgs | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "n8n.envConfigName" . }}
            - secretRef:
                name: {{ include "n8n.envSecretName" . }}
          readinessProbe:
            httpGet:
              path: {{ .Values.worker.readinessProbe.path }}
              port: 5678
            periodSeconds: {{ .Values.worker.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.worker.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.worker.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.worker.livenessProbe.path }}
              port: 5678
            periodSeconds: {{ .Values.worker.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.worker.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.worker.livenessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: n8n
              mountPath: {{ .Values.persistence.mountPath }}
      volumes:
        - name: n8n
          persistentVolumeClaim:
            claimName: {{ include "n8n.pvcName" . }}
{{- end }}
