apiVersion: v1
kind: Secret
metadata:
  name: {{ include "n8n.envSecretName" . }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_POSTGRESDB_PASSWORD: {{ .Values.secret.dbPassword | quote }}
  N8N_ENCRYPTION_KEY: {{ .Values.secret.encryptionKey | quote }}
  N8N_SMTP_PASS: {{ .Values.secret.smtpPass | quote }}
