{{- if .Values.tinybird.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openstatus.tinybirdName" . }}
  labels:
    {{- include "openstatus.labels" . | nindent 4 }}
    app.kubernetes.io/component: tinybird
spec:
  type: {{ .Values.tinybird.service.type }}
  ports:
    - name: http
      port: {{ .Values.tinybird.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "openstatus.componentLabels" (dict "context" . "component" "tinybird") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openstatus.tinybirdName" . }}
  labels:
    {{- include "openstatus.labels" . | nindent 4 }}
    app.kubernetes.io/component: tinybird
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openstatus.componentLabels" (dict "context" . "component" "tinybird") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openstatus.componentLabels" (dict "context" . "component" "tinybird") | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: tinybird
          image: "{{ .Values.tinybird.image.repository }}:{{ .Values.tinybird.image.tag }}"
          imagePullPolicy: {{ .Values.tinybird.image.pullPolicy }}
          env:
            - name: COMPATIBILITY_MODE
              value: "1"
          ports:
            - name: http
              containerPort: {{ .Values.tinybird.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.tinybird.resources | nindent 12 }}
{{- end }}
