{{- if .Values.privateLocation.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openstatus.privateLocationName" . }}
  labels:
    {{- include "openstatus.labels" . | nindent 4 }}
    app.kubernetes.io/component: private-location
spec:
  type: {{ .Values.privateLocation.service.type }}
  ports:
    - name: http
      port: {{ .Values.privateLocation.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "openstatus.componentLabels" (dict "context" . "component" "private-location") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openstatus.privateLocationName" . }}
  labels:
    {{- include "openstatus.labels" . | nindent 4 }}
    app.kubernetes.io/component: private-location
spec:
  replicas: {{ .Values.privateLocation.replicaCount }}
  selector:
    matchLabels:
      {{- include "openstatus.componentLabels" (dict "context" . "component" "private-location") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openstatus.componentLabels" (dict "context" . "component" "private-location") | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: private-location
          image: "{{ .Values.privateLocation.image.repository }}:{{ .Values.privateLocation.image.tag }}"
          imagePullPolicy: {{ .Values.privateLocation.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "openstatus.configName" . }}
            - secretRef:
                name: {{ include "openstatus.secretName" . }}
          env:
            - name: GIN_MODE
              value: release
            - name: PORT
              value: {{ .Values.privateLocation.service.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.privateLocation.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.privateLocation.resources | nindent 12 }}
{{- end }}
